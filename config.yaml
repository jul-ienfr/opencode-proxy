server:
  host: 0.0.0.0
  port: 4000
  web_port: 8082
  debug: false
  log_dir: logs
upstream:
  openai_base: https://opencode.ai/zen/go/v1/chat/completions
  anthropic_base: https://opencode.ai/zen/go/v1/messages
  free_base: https://opencode.ai/zen/v1/chat/completions
  proxy: ''
  timeout:
    connect: 30
    read: 600
    write: 30
    pool: 10
  max_connections: 200
  max_keepalive: 50
  keepalive_expiry: 120
  max_body_size: 10485760
routing:
  opus_model: kimi-k2.6
  sonnet_model: glm-5.1
  haiku_model: minimax-m2.5
  key_routing: round-robin
  disable_mapping: false
  aliases:
    nimo: mimo
models:
  glm-5.2:
    protocol: openai
  glm-5.1:
    protocol: openai
  glm-5:
    protocol: openai
  kimi-k2.5:
    protocol: openai
  kimi-k2.6:
    protocol: openai
  kimi-k2.7:
    protocol: openai
  deepseek-v4-pro:
    protocol: openai
  deepseek-v4-flash:
    protocol: openai
  mimo-v2-pro:
    protocol: openai
  mimo-v2-omni:
    protocol: openai
  mimo-v2.5-pro:
    protocol: openai
  mimo-v2.5:
    protocol: openai
  minimax-m2.7:
    protocol: anthropic
  minimax-m3:
    protocol: anthropic
  minimax-m2.5:
    protocol: anthropic
  qwen3.7-max:
    protocol: anthropic
  qwen3.7-plus:
    protocol: anthropic
  qwen3.6-plus:
    protocol: anthropic
  qwen3.5-plus:
    protocol: anthropic
free_model_map:
  deepseek-v4-flash: deepseek-v4-flash-free
  mimo-v2.5: mimo-v2.5-free
ip_rotation:
  enabled: true
  proxy_mode: vpn
  mode: docker
  free_only: true
  vpn_proxy_port: 8888
  openvpn:
    configs_dir: vpn/configs
    auth_file: vpn/credentials.txt
    servers:
    - name: de1227
      config: vpn/configs/de1227.ovpn
    - name: de1223
      config: vpn/configs/de1223.ovpn
  quota_per_ip: 300
  switch_delay: 5
  docker_image: qmcgaw/gluetun
  docker_image_custom: ''
  nordvpn_token: ''
  nordvpn_technology: NordLynx
  nordvpn_country: Germany
  nordvpn_group: ''
  docker_killswitch: true
  docker_dns_over_tls: true
  nordvpn_exe: ''
  socks5_proxies:
    rotate_socks5: true
    list: []
  use_nordvpn_api: false
  api_cache_ttl: 900
  circuit_breaker_threshold: 3
  circuit_breaker_recovery: 300
  backoff_max_delay: 60
  watchdog_interval: 60
  geo_filter:
    include: []
    exclude: []
  rotation_rules: []
  schedule:
    enabled: false
    rules: []
custom_routes:
  mimov25:
    match:
    - mimo-v2.5
    model: mimo-v2.5
    thinking: adaptive
  mimov25pro:
    match:
    - mimo-v2.5-pro
    model: deepseek-v4-flash
  qwen35plus:
    match:
    - qwen3.5-plus
    model: deepseek-v4-flash
    thinking: adaptive
  gpt54mini:
    match:
    - gpt-5.4-mini
    model: deepseek-v4-flash
  kimik26:
    match:
    - kimi-k2.6
    model: deepseek-v4-flash
api_keys: []
tool_capabilities:
  _default:
    supported_tools: null
    unsupported_tools: []
    system_hint: null
  mimo-v2-pro:
    supported_tools: []
    unsupported_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - WebSearch
    - WebFetch
    - TodoWrite
    system_hint: null
web_search:
  mode: duckduckgo
  target_model: null
  max_results: 5
  timeout: 10
cache:
  max_size: 1000
  ttl: 300
  min_prompt_size: 2000
circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 60
rate_limit:
  rps: 50
  burst: 100
  stale_ttl: 300
key_pause:
  default_pause: 60
  max_pause: 600
database:
  busy_timeout: 5000
  cache_size: 64000
  mmap_size: 268435456
  commit_interval: 5
  commit_batch: 10
background:
  wal_checkpoint_interval: 3600
  key_pause_cleanup_interval: 30
  quota_fetch_interval: 300
  health_cache_ttl: 15
  health_timeout: 5
  custom_routes_check_interval: 5
  tool_cap_check_interval: 5
streaming:
  sse_keepalive_interval: 15
  line_buffer_max: 1000000
  retry_attempts: 2
debug:
  truncate_max: 10240
  flush_interval: 10
  max_size: 52428800
  log_lines_max: 200
thinking:
  min_tokens:
    deepseek-v4-flash: 2048
    deepseek-v4-pro: 4096
  default_min_tokens: 256
cache_rewrite_models:
- mimo-v2.5
- mimo-v2-pro
- mimo-v2-omni
- mimo-v2.5-pro
dashboard:
  universal_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Grep
  - Glob
  - WebSearch
  display_lines: 35
