tool_capabilities:
  _default:
    supported_tools: null
    unsupported_tools: []
    system_hint: null
  mimo-v2-pro:
    supported_tools: []
    unsupported_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - WebSearch
    - WebFetch
    - TodoWrite
    system_hint: null
web_search:
  mode: duckduckgo
  target_model: null
  max_results: 5
  timeout: 10
cache:
  max_size: 1000
  ttl: 300
  min_prompt_size: 2000
circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 60
rate_limit:
  rps: 50
  burst: 100
  stale_ttl: 300
key_pause:
  default_pause: 60
  max_pause: 600
database:
  busy_timeout: 5000
  cache_size: 64000
  mmap_size: 268435456
  commit_interval: 5
  commit_batch: 10
background:
  wal_checkpoint_interval: 3600
  key_pause_cleanup_interval: 30
  quota_fetch_interval: 300
  health_cache_ttl: 15
  health_timeout: 5
  custom_routes_check_interval: 5
  tool_cap_check_interval: 5
streaming:
  sse_keepalive_interval: 15
  line_buffer_max: 1000000
  retry_attempts: 2
debug:
  truncate_max: 10240
  flush_interval: 10
  max_size: 52428800
  log_lines_max: 200
thinking:
  min_tokens:
    deepseek-v4-flash: 2048
    deepseek-v4-pro: 4096
  default_min_tokens: 256
cache_rewrite_models:
- mimo-v2.5
- mimo-v2-pro
- mimo-v2-omni
- mimo-v2.5-pro
dashboard:
  universal_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Grep
  - Glob
  - WebSearch
  display_lines: 35
