server:
  host: 0.0.0.0
  port: 4000
  debug: false
  log_dir: logs
upstream:
  openai_base: https://opencode.ai/zen/go/v1/chat/completions
  anthropic_base: https://opencode.ai/zen/go/v1/messages
  free_base: https://opencode.ai/zen/v1/chat/completions
  free_models_url: ''
  proxy: ''
  timeout:
    connect: 30
    read: 600
    write: 30
    pool: 10
  max_connections: 200
  max_keepalive: 50
  keepalive_expiry: 120
  max_body_size: 10485760
routing:
  opus_model: kimi-k2.6
  sonnet_model: glm-5.1
  haiku_model: minimax-m2.5
  key_routing: round-robin
  disable_mapping: false
  aliases:
    nimo: mimo
models:
  glm-5.2:
    protocol: openai
  glm-5.1:
    protocol: openai
  glm-5:
    protocol: openai
  kimi-k2.5:
    protocol: openai
  kimi-k2.6:
    protocol: openai
  kimi-k2.7:
    protocol: openai
  deepseek-v4-pro:
    protocol: openai
  deepseek-v4-flash:
    protocol: openai
  mimo-v2-pro:
    protocol: openai
  mimo-v2-omni:
    protocol: openai
  mimo-v2.5-pro:
    protocol: openai
  mimo-v2.5:
    protocol: openai
  minimax-m2.7:
    protocol: anthropic
  minimax-m3:
    protocol: anthropic
  minimax-m2.5:
    protocol: anthropic
  qwen3.7-max:
    protocol: anthropic
  qwen3.7-plus:
    protocol: anthropic
  qwen3.6-plus:
    protocol: anthropic
  qwen3.5-plus:
    protocol: anthropic
  kimi-k3:
    protocol: openai
  kimi-k2.7-code:
    protocol: openai
  glm-5.3:
    protocol: openai
  qwen3.8-max:
    protocol: anthropic
  hy3:
    protocol: openai
  hy3-preview:
    protocol: openai
  gpt-5.6-luna:
    protocol: openai
  grok-4.5:
    protocol: openai
  muse-spark-1.2-contributor:
    protocol: openai
    geo:
      extends: meta-muse-spark
  muse-spark-1.2-contributor-free:
    protocol: openai
    geo:
      extends: meta-muse-spark
  deepseek-v4-flash-free:
    protocol: openai
  hy3-free:
    protocol: openai
  laguna-s-2.1-free:
    protocol: openai
  mimo-v2.5-free:
    protocol: openai
  nemotron-3-ultra-free:
    protocol: openai
  nemotron-3.5-lightning-free:
    protocol: openai
  x-preview-f-free:
    protocol: openai
free_model_map:
  glm-5.2: deepseek-v4-flash-free
  glm-5.1: deepseek-v4-flash-free
  glm-5: deepseek-v4-flash-free
  kimi-k2.5: deepseek-v4-flash-free
  kimi-k2.6: deepseek-v4-flash-free
  kimi-k2.7: deepseek-v4-flash-free
  deepseek-v4-pro: deepseek-v4-flash-free
  deepseek-v4-flash: deepseek-v4-flash-free
  mimo-v2-pro: deepseek-v4-flash-free
  mimo-v2-omni: deepseek-v4-flash-free
  mimo-v2.5-pro: deepseek-v4-flash-free
  mimo-v2.5: deepseek-v4-flash-free
  minimax-m2.7: mimo-v2.5-free
  minimax-m3: mimo-v2.5-free
  minimax-m2.5: mimo-v2.5-free
  qwen3.7-max: mimo-v2.5-free
  qwen3.7-plus: mimo-v2.5-free
  qwen3.6-plus: mimo-v2.5-free
  qwen3.5-plus: mimo-v2.5-free
  hy3: hy3-free
  muse-spark-1.2-contributor: muse-spark-1.2-contributor-free
ip_rotation:
  enabled: true
  proxy_mode: vpn
  dual_station: true
  station_count: 3
  strict_free: false
  quota_per_ip: 15
  switch_delay: 1
  docker_container: opencode-vpn
  docker_compose_file: docker-compose.yml
  vpn_proxy_port: 8888
  socks5_proxy_port: 1080
  socks5_proxy_port_2: 1081
  socks5_proxies: []
  socks5_auto_rotate: true
  use_nordvpn_api: false
  custom_ovpn_file: ''
  vpn_proxy_port_2: 8889
  docker_container_2: opencode-vpn-2
  compose_service_2: vpn-gluetun-2
  state_file_2: logs/vpn_state2.json
  credentials_file: vpn_configs/credentials.txt
  server_countries: Germany,Netherlands,France,Spain,Poland,Sweden,Denmark,Finland,Norway,Belgium,Switzerland,Austria,Portugal,Italy,Ireland,United
    Kingdom,Czech Republic,Estonia,Latvia,Lithuania,Romania,Hungary,Greece,Slovakia,Slovenia,Croatia,Bulgaria,Luxembourg,Iceland,Cyprus,Malta,United
    States,Canada,Australia,Japan,Singapore
  circuit_breaker_threshold: 3
  circuit_breaker_recovery: 300
  backoff_max_delay: 60
  bad_ttl: 60
  ip_check_url: https://api.ipify.org
  ip_check_urls:
  - https://api.ipify.org
  - https://icanhazip.com
  - https://ifconfig.me/ip
  - https://checkip.amazonaws.com
  identity_rotation: true
  identity_diversity: true
  identity_max_profiles: 256
  identity_profiles:
  - impersonate: chrome131
    user_agent: null
    extra_headers: {}
  update_enabled: true
  update_check_interval: 21600
  update_apply_window: 03:00-05:00
  update_apply_idle_minutes: 15
  update_apply_max_defer_hours: 24
  watchdog_interval: 5
  watchdog_backoff_base: 15
  watchdog_backoff_max: 60
  wait_healthy_poll: 0.5
  status_cache_seconds: 2.0
  connect_retry_interval: 20
  rotation_fail_cooldown: 60
  rotation_stagger: 2
  recent_ip_window: 20
  recent_ip_max_age: 1800
  shared_rotation_file: logs/shared_rotation.json
  server_provider: nordvpn
  control_api_key: ''
  control_enabled: true
  vpn_stack: wireguard
  auto_ov_fail_threshold: 3
  auto_ov_return_min: 60
  auto_wg_egress_ticks: 3
  egress_failure_tick_interval: 2.0
  ip_probe_budget: 8.0
  control_pin_timeout: 20
  control_pin_catchup: 25
  auto_flip_cooldown_min: 30
  rotation_wait_timeout: 20
  rotation_max_duration: 240
  country_rotation: true
  country_offset: 14
  docker_events: true
  max_free_attempts: 3
  free_exception_fallback: station-first
geo:
  enabled: true
  version: 1
  policies:
    meta-muse-spark:
      allowed_countries:
      - United States
      - Canada
      - United Kingdom
      - Australia
      - Japan
      - Singapore
      mode: strict
      require_vpn: true
      last_checked_at: '2026-08-20T00:00:00Z'
custom_routes:
  mimov25:
    match:
    - mimo-v2.5
    model: muse-spark-1.2-contributor
    thinking: adaptive
    geo:
      extends: meta-muse-spark
  mimov25pro:
    match:
    - mimo-v2.5-pro
    model: muse-spark-1.2-contributor
    geo:
      extends: meta-muse-spark
  qwen35plus:
    match:
    - qwen3.5-plus
    model: muse-spark-1.2-contributor
    thinking: adaptive
    geo:
      extends: meta-muse-spark
  gpt54mini:
    match:
    - gpt-5.4-mini
    model: muse-spark-1.2-contributor
    geo:
      extends: meta-muse-spark
  kimik26:
    match:
    - kimi-k2.6
    model: muse-spark-1.2-contributor
    geo:
      extends: meta-muse-spark
  gpt56luna:
    match:
    - gpt-5.6-luna
    model: muse-spark-1.2-contributor
    geo:
      extends: meta-muse-spark
  deepseekv4flash:
    match:
    - deepseek-v4-flash
    model: muse-spark-1.2-contributor
    geo:
      extends: meta-muse-spark
api_keys: []
tool_capabilities:
  _default:
    supported_tools: null
    unsupported_tools: []
    system_hint: null
  mimo-v2-pro:
    supported_tools: []
    unsupported_tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob
    - WebSearch
    - WebFetch
    - TodoWrite
    system_hint: null
web_search:
  mode: duckduckgo
  target_model: null
  max_results: 5
  timeout: 10
cache:
  max_size: 1000
  ttl: 300
  min_prompt_size: 2000
circuit_breaker:
  failure_threshold: 5
  recovery_timeout: 60
rate_limit:
  rps: 50
  burst: 100
  stale_ttl: 300
key_pause:
  default_pause: 60
  max_pause: 600
database:
  busy_timeout: 5000
  cache_size: 64000
  mmap_size: 268435456
  commit_interval: 5
  commit_batch: 10
background:
  wal_checkpoint_interval: 3600
  key_pause_cleanup_interval: 30
  quota_fetch_interval: 300
  health_cache_ttl: 15
  health_timeout: 5
  custom_routes_check_interval: 5
  tool_cap_check_interval: 5
streaming:
  sse_keepalive_interval: 15
  line_buffer_max: 1000000
  retry_attempts: 2
debug:
  truncate_max: 10240
  flush_interval: 10
  max_size: 52428800
  log_lines_max: 200
thinking:
  min_tokens:
    deepseek-v4-flash: 2048
    deepseek-v4-pro: 4096
  default_min_tokens: 256
cache_rewrite_models:
- mimo-v2.5
- mimo-v2-pro
- mimo-v2-omni
- mimo-v2.5-pro
dashboard:
  universal_tools:
  - Read
  - Write
  - Edit
  - Bash
  - Grep
  - Glob
  - WebSearch
  display_lines: 35
free_discovery:
  enabled: true
  interval: 3600
  auto_persist: true
  default_target: mimo-v2.5-free
traffic:
  enabled: true
  max_frames: 500
  body_cap: 131072
  max_bytes: 33554432
