      - station_entry_ip
      - load
    not_gives:
      - credentials
    notes: >-
      SOCKS5 sur le port 1080, identifiants du compte requis. Utilisé par
      wg-nord/fetch-proxies. Vérifier que le port et l'auth sont toujours
      supportés avant intégration.

  - id: nordvpn_credentials
    name: "API NordVPN — credentials du compte"
    url: "https://api.nordvpn.com/v1/users/services/credentials"
    category: official
    kind: credentials
    auth: token
    refresh: realtime
    status: active
    gives:
      - nordlynx_private_key
      - username
      - password
    not_gives:
      - server_list
    notes: >-
      Nécessite un token NordVPN (Authorization: token:<token>). Ne jamais
      transiter par un Worker tiers. Utilisé par NordGen/wg-nord pour générer
      les configs.

  - id: nordvpn_ovpn_archive
    name: "Archive officielle OpenVPN (tous serveurs)"
