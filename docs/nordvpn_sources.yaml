    url: "https://team-cymru.com/community-services/ip-asn-mapping/"
    category: network
    kind: dataset
    auth: none
    refresh: realtime
    status: to_evaluate
    gives:
      - ip_to_asn
      - asn_name
    not_gives:
      - vpn_provider_label
    notes: "Whois/DNS-based, utile pour un lookup ponctuel d'egress."

  - id: maxmind_geolite2_asn
    name: "MaxMind GeoLite2 ASN"
    url: "https://dev.maxmind.com/geoip/geolite2-free-geolocation-data/"
    category: network
    kind: dataset
    auth: license
    refresh: monthly
    status: to_evaluate
    gives:
      - ip_to_asn
      - ip_to_country
    not_gives:
      - vpn_provider_label
    notes: "Base locale gratuite sous licence ; classification ASN/pays."

  # ── Commercial ───────────────────────────────────────────────────────
  - id: ipapi_is_vpn_db
    name: "ipapi.is — base VPN / egress"
    url: "https://ipapi.is/vpn-detection.html"
    category: commercial
    kind: network_ranges
    auth: paid
    refresh: regular
    status: to_evaluate
    gives:
      - vpn_exit_nodes
      - vpn_ranges
      - provider_label
    not_gives:
      - per_server_hostname
    notes: >-
      Base CSV/MMDB et API, inclut NordVPN. La meilleure option payante pour
      qualifier un egress indépendamment de l'API NordVPN.

  - id: ipasis_vpn_directory
    name: "IPASIS — annuaire ASN des VPN"
    url: "https://ipasis.com/directory/vpn-providers"
    category: commercial
    kind: network_ranges
    auth: paid
    refresh: regular
    status: to_evaluate
    gives:
      - asn
      - provider_mapping
      - detection_api
    not_gives:
      - per_server_mapping
    notes: >-
      Approche ASN (M247 AS9009, etc.). Utile pour la détection, moins précis
      pour l'attribution d'un serveur.

  - id: abstractapi_vpn_checker
    name: "AbstractAPI — VPN checker"
    url: "https://www.abstractapi.com/guides/vpn-checker/nord-vpn-ip-lookup"
    category: commercial
    kind: network_ranges
    auth: paid
    refresh: realtime
    status: to_evaluate
    gives:
      - vpn_detection
      - ip_intelligence
    not_gives:
      - server_list
    notes: "API de détection, pas un catalogue de serveurs."

  # ── Outils / documentation (pas des sources de données) ─────────────
  - id: mustafachyi_nordgen_repo
    name: "NordGen — dépôt de référence"
    url: "https://github.com/mustafachyi/NordVPN-WireGuard-Config-Generator"
    category: tool
    kind: tool
    auth: none
    refresh: on_demand
    status: reference
    gives:
      - decoder_packed_catalog
      - cli_generator
      - worker_implementation
    not_gives:
      - independent_server_data
    notes: >-
      Contient le Worker nordgen, le frontend Vue, la CLI Python et les tests.
      Utile pour décoder /api/servers et comprendre le format packé.

  - id: wg_nord_cli
    name: "wg-nord — CLI Rust"
    url: "https://github.com/n-thumann/wg-nord"
    category: tool
    kind: tool
    auth: token
    refresh: on_demand
    status: reference
    gives:
      - wireguard_config_generation
    not_gives:
      - independent_server_data
    notes: "Génère une config à partir d'un hostname et d'un token NordVPN."

  - id: nord_python_lib
    name: "nord — client Python"
    url: "https://nord.readthedocs.io/en/latest/reference/api.html"
    category: tool
    kind: tool
    auth: token
    refresh: on_demand
    status: reference
    gives:
      - api_client
    not_gives:
      - independent_server_data
    notes: "Client de l'API NordVPN, utile comme référence de schéma."

  - id: sleeplessbeastie_api
    name: "Guide API NordVPN (2019)"
    url: "https://sleeplessbeastie.eu/2019/02/18/how-to-use-public-nordvpn-api/"
    category: legacy
    kind: documentation
    auth: none
    refresh: static
    status: reference
    gives:
      - legacy_api_examples
    not_gives:
      - current_endpoints
    notes: >-
      Documente l'ancien /server (aujourd'hui 403). Utile pour l'historique,
      pas pour l'implémentation actuelle.

hierarchy:
  catalog_primary: nordvpn_api_servers
  catalog_fallbacks:
    - nordcache_packed
    - gluetun_manifest
    - gluetun_embedded_catalog
    - nordvpn_api_cache
  hostname_completeness:
    - nordvpn_ovpn_archive
    - gluetun_embedded_catalog
  https_proxy:
    - nordvpn_api_proxy_ssl
    - ip_address_list_nordvpn
  socks5_proxy:
    - nordvpn_api_socks
  network_classification:
    - x4bnet_lists_vpn
    - netify_nordvpn
    - cloud_ip_ranges_nordvpn
    - iptoolskit_nordvpn
    - ipapi_is_vpn_db
    - iplocate_asn_db
  egress_truth: "observed_only"
  egress_sources:
    - ip_registry_db
    - nordvpn_api_insights
