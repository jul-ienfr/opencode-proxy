      - country
      - city
      - isp
      - isp_asn
      - protected
    not_gives:
      - server_list
    notes: >-
      Décrit l'IP publique de l'appelant. Très utile pour vérifier qu'un egress
      observé appartient bien à NordVPN (ex. isp= NordVPN, isp_asn=136787).

  - id: nordvpn_api_proxy_ssl
    name: "API NordVPN — proxys HTTPS (proxy_ssl)"
    url: "https://api.nordvpn.com/v1/servers/recommendations?filters[servers_technologies][identifier]=proxy_ssl&limit=100"
    category: official
    kind: proxy_list
    auth: none
    refresh: realtime
    status: active
