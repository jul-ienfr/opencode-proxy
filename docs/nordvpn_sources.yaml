    notes: >-
      Extrait du binaire /gluetun-entrypoint (17 103 entrées, dont al36..al75).
      Il contient des serveurs absents du manifeste et de l'API publique, mais
      peut manquer les serveurs créés après le build de l'image.

  - id: gluetun_manifest
    name: "Manifeste NordVPN du conteneur Gluetun"
    url: "container:/gluetun/servers/nordvpn.json"
    category: project
    kind: catalog
    auth: none
    refresh: static
    status: active
    gives:
      - hostname
      - station_entry_ip
      - wireguard_public_key
      - country
      - city
    not_gives:
      - load
      - egress_ip
    used_by:
      - "scripts/merge_gluetun_catalog.py"
    notes: >-
      Téléchargé par Gluetun au démarrage et rafraîchi selon UPDATER_PERIOD
      (480 h) ; le proxy force un wipe applicatif en cas d'incident. 14 132
      entrées au 2026-11-01. Le manifeste gagne sur le catalogue embarqué lors
      du chargement Gluetun.

  - id: gluetun_merge_script
