      - hostname
      - station_entry_ip
      - load
    not_gives:
      - credentials
      - socks_endpoint
    used_by:
      - "scripts/ip_preselection.py"
    notes: "Source de la liste ip-address-list ; port HTTPS 89 côté client."

  - id: nordvpn_api_socks
    name: "API NordVPN — proxys SOCKS"
    url: "https://api.nordvpn.com/v1/servers?filters[servers_technologies][identifier]=socks&limit=100"
    category: official
    kind: proxy_list
    auth: none
    refresh: realtime
    status: to_evaluate
    gives:
