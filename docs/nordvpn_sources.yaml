version: 1
generated_at: "2026-11-02"
scope: "Registre des sources de serveurs/IP NordVPN pour opencode-proxy"
operator_sources:
  - wg_nord_pages
  - nordgen_selfhoster
  - ip_address_list_nordvpn
  - netify_nordvpn

sources:
  # ── Sources fournies par l'opérateur ──────────────────────────────────
  - id: wg_nord_pages
    name: "NordVPN WireGuard Config Generator (frontend hébergé)"
    url: "https://wg-nord.pages.dev/"
    category: mirror
    kind: catalog_frontend
    auth: none
    refresh: realtime
    status: to_evaluate
    recorded_at: "2026-11-02"
    gives:
      - hostname
      - station_entry_ip
      - load
      - wireguard_public_key
      - config_files
    not_gives:
      - egress_ip
      - network_ranges
    upstream: "https://api.nordvpn.com/v1/servers?limit=7000&filters[servers_technologies][identifier]=wireguard_udp"
    notes: >-
      Frontend statique. Il interroge l'API officielle via un Worker Cloudflare
      tiers (proxy.rasimhamidi93717911.workers.dev), pas via une base propre.
      Il expose aussi /key (échange de token NordVPN contre la clé NordLynx) et
      /fetch-proxies (liste SOCKS officielle). Le token transite par le Worker
      tiers : à ne pas utiliser avec un compte réel en production.

  - id: nordgen_selfhoster
    name: "NordGen — catalogue packé et générateur WireGuard"
    url: "https://nordgen.selfhoster.win/"
    category: operator
    kind: catalog_mirror
    auth: none
    refresh: 5m
    status: to_evaluate
    recorded_at: "2026-11-02"
    gives:
      - hostname
      - station_entry_ip
      - load
      - wireguard_public_key
      - country_city
      - server_groups
    not_gives:
      - egress_ip
      - independent_measurements
    upstream: "https://nordcache.selfhoster.win/api/servers"
    notes: >-
      Worker Cloudflare (Hono) + KV. /api/servers renvoie un catalogue packé
      [publicKeys, countries] de ~93,6 Ko, avec ETag et cache 5 min. Le cron
      rafraîchit toutes les 5 min depuis nordcache. La provenance de nordcache
      n'est pas documentée publiquement ; le dépôt NordGen, lui, utilise l'API
      officielle. Format non standard : nécessite le décodeur du dépôt.

  - id: ip_address_list_nordvpn
    name: "ip-address-list/nordvpn — proxys HTTPS NordVPN"
    url: "https://github.com/ip-address-list/nordvpn"
    category: community
    kind: proxy_list
    auth: none
    refresh: weekly
    status: to_evaluate
    recorded_at: "2026-11-02"
    gives:
      - proxy_hostname
      - https_proxy_endpoint_port_89
    not_gives:
      - server_ip
      - wireguard_endpoint
      - usable_credentials
    upstream: "https://api.nordvpn.com/v1/servers/recommendations?filters[servers_technologies][identifier]=proxy_ssl"
    notes: >-
      GitHub Action hebdomadaire (dimanche 00:00). 14 pays, 100 recommandations
      par pays. generic/<cc>.txt = hostnames ; foxyproxy/<cc>.txt =
      ssl://username:password@host:89 avec identifiants factices. Ce ne sont pas
      des IP de serveurs ni des configs WireGuard.

  - id: netify_nordvpn
    name: "Netify — réseaux, ASN et couverture NordVPN"
    url: "https://www.netify.ai/resources/vpns/nordvpn"
    category: commercial
    kind: network_ranges
    auth: paid
    refresh: unknown
    status: to_evaluate
    recorded_at: "2026-11-02"
    gives:
      - asn
      - ipv4_network_ranges
      - ipv6_network_ranges
      - country_city_counts
      - domains
    not_gives:
      - per_server_hostnames
      - per_server_egress_ip
    notes: >-
      Page indépendante de renseignement réseau : 57 pays, 102 villes,
      1 191 plages IPv4 et 119 plages IPv6 (échantillon HTML ; 1 188 + 116
      supplémentaires). Les données complètes passent par l'API IP / datasets
      payants. Utile pour qualifier un egress ou vérifier un ASN, pas pour
      choisir un serveur.

  # ── API et artefacts officiels NordVPN ────────────────────────────────
  - id: nordvpn_api_servers
    name: "API NordVPN — catalogue complet"
    url: "https://api.nordvpn.com/v1/servers?limit=0"
    category: official
    kind: catalog
    auth: none
    refresh: 6h
    status: active
    gives:
      - hostname
      - station_entry_ip
      - ipv6_station
      - load
      - status
      - country
      - city
      - technologies
      - wireguard_public_key
    not_gives:
      - egress_ip
      - measured_throughput
    used_by:
      - "free/ip_registry/catalog.py"
      - "vpn/manager.py"
      - "scripts/ip_preselection.py"
    notes: >-
      Source de vérité du catalogue. ~7 229 serveurs online au 2026-11-02,
      ~29 Mo pour limit=0. Le champ station/ips est l'IP d'entrée, pas
      l'egress public.

  - id: nordvpn_api_recommendations
    name: "API NordVPN — serveurs recommandés"
    url: "https://api.nordvpn.com/v1/servers/recommendations"
    category: official
    kind: catalog
    auth: none
    refresh: realtime
    status: active
    gives:
      - hostname
      - station_entry_ip
      - load
      - country_city
      - technologies
    not_gives:
      - egress_ip
    used_by:
      - "vpn/manager.py"
      - "scripts/ip_preselection.py"
    notes: >-
      Tri par score interne NordVPN, filtre pays et technologie. Utilisé pour
      le least-loaded (top-K par load) et le proxy_ssl.

  - id: nordvpn_api_countries
    name: "API NordVPN — pays"
    url: "https://api.nordvpn.com/v1/servers/countries"
    category: official
    kind: metadata
    auth: none
    refresh: 6h
    status: active
    gives:
      - country_id
      - country_name
      - country_code
    not_gives:
      - server_list
    used_by:
      - "vpn/manager.py"
      - "scripts/ip_preselection.py"
    notes: "Mapping id pays → nom, nécessaire aux filtres recommendations."

  - id: nordvpn_api_groups
    name: "API NordVPN — groupes de serveurs"
    url: "https://api.nordvpn.com/v1/servers/groups"
    category: official
    kind: metadata
    auth: none
    refresh: 6h
    status: active
    gives:
      - group_id
      - group_identifier
      - group_title
    not_gives:
      - server_list
    notes: "Groupes (standard, dedicated_ip, p2p, etc.)."

  - id: nordvpn_api_technologies
    name: "API NordVPN — technologies"
    url: "https://api.nordvpn.com/v1/technologies"
