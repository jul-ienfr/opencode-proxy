    notes: >-
      Endpoint correct : /v1/technologies. /v1/servers/technologies renvoie 403
      (chemin obsolète).

  - id: nordvpn_api_insights
    name: "API NordVPN — insights de l'IP appelante"
    url: "https://api.nordvpn.com/v1/helpers/ips/insights"
    category: official
    kind: geolocation
    auth: none
    refresh: realtime
    status: active
    gives:
