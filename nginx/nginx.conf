# Ultra-fast reverse proxy devant opencode (SSE-safe)
# Usage: docker run -p 80:80 -v ./nginx/nginx.conf:/etc/nginx/nginx.conf nginx:alpine
# ou systemd nginx avec ce fichier en /etc/nginx/sites-enabled/opencode

worker_processes auto;
worker_rlimit_nofile 65535;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;  # opencode log déjà, évite double IO
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;  # aligne opencode keepalive_expiry 30
    keepalive_requests 10000;
    client_max_body_size 10m;
    types_hash_max_size 2048;

    # Gzip off pour SSE (déjà désactivé dans opencode), on pour JSON
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain;
    gzip_proxied any;

    upstream opencode {
        server opencode-proxy:4000 max_fails=2 fail_timeout=5s;
        keepalive 200;  # aligne max_keepalive 200
    }

    server {
        listen 80 reuseport backlog=4096;
        # listen 443 ssl http2 reuseport; # décommenter + certs

        # SSE /v1/messages et /v1/responses : pas de buffering
        location ~ ^/(v1/messages|anthropic/v1/messages|v1/chat/completions|v1/responses) {
            proxy_pass http://opencode;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 30s;
            proxy_connect_timeout 5s;
            chunked_transfer_encoding on;
        }

        # Dashboard /api + static : buffering ok, cache 1h
        location / {
            proxy_pass http://opencode;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_buffering on;
            proxy_buffers 8 16k;
            proxy_read_timeout 30s;
        }
    }
}
