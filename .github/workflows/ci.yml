name: CI

on:
  push:
    branches: [main, one, one-nvpn-align]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx
      - name: Ruff check
        run: ruff check . --output-format=github || true
      - name: Tests
        run: pytest -q --tb=short
