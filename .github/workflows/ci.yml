name: CI

on:
  push:
    branches: [main, one, one-nvpn-align]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    # [V8.4] 15 → 25 min : après le correctif DDG (721 s → 0,13 s) la suite
    # prend ~6 min en local ; un runner partagé est plus lent, et un job qui
    # expire ne prouve rien (on ne sait pas si le code est cassé ou le budget
    # trop court).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx mypy pip-audit
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format
        # NON bloquant : `ruff` est installé sans pinnage alors que le dépôt a
        # été formaté par une version antérieure — ~96 fichiers divergent au
        # format près (vérifié sur HEAD comme après les changements de boot).
        # `Ruff check` (bloquant) couvre les vraies erreurs. À rebasculer en
        # bloquant après un `ruff format .` dédié OU un pinnage de ruff.
        run: ruff format --check .
        continue-on-error: true
      # [P6] mypy bloquant sur TOUT le code de production (26/08 : rachat
      # terminé — 0 erreur sur les 15 cibles). Le pas progressif ne couvre
      # plus que tests/ pour visibilité.
      - name: Mypy (gate code production)
        run: >-
          mypy traffic_capture.py docker_events.py trust.py shared_rotation.py
          shared_state.py config/__init__.py config/settings.py dashboard/api.py
          protocol_mapping.py opencode.py vpn_manager.py dashboard/display.py
          free_ip_pool.py station_supervisor.py app/db/__init__.py
          gui/window.py gui/tray.py gui/__init__.py gui/icon.py gui/_webview_main.py
          scripts/make_credentials_env.py scripts/bench_perf.py scripts/bench.py
          --ignore-missing-imports --follow-imports=silent
      - name: Mypy (progressif, non bloquant)
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      - name: Contrats d'alignement (BLOQUANT, ~6 s)
        # [V8.4] Premier pas payé : il échoue en quelques secondes si un
        # contrat mesuré casse (gate free, parité client, routage, dérive).
        # Avant, tout passait par un unique `pytest` de 15 min : une régression
        # de contrat se noyait dans les tests réseau et le job expirait.
        run: python scripts/ci_contracts.py
      - name: Config sans clé inerte (BLOQUANT)
        # [V7.2] Une clé de `config.yaml` que personne ne lit (faute de frappe,
        # vestige) est un mensonge silencieux : `dashboard_trust.require_token`
        # existait sans jamais être consulté — un réglage de sécurité inopérant.
        # `--strict` compare à la référence versionnée et refuse toute clé morte
        # nouvelle.
        run: python scripts/config_audit.py --strict
      - name: Tests with coverage
        # [V8.4] `-m "not docker"` : le seul test Docker-marké (chaos kill -9)
        # exige un daemon live et n'a rien à faire dans le gate par défaut —
        # c'est ce qui faisait échouer la CI. Reste exécutable via `-m docker`.
        run: pytest -q -m "not docker" --cov --cov-report=term-missing --cov-fail-under=60
        # Palier audit 2026-10-04 (mesuré 62%) — synchronisé avec scripts/gate.ps1
      # ── [Phase 5/9 plan boot] Garde-fous de performance du démarrage ──
      # Ces trois pas verrouillent les acquis du chantier boot : sans eux, une
      # régression d'import (ou un asset périmé) repasserait inaperçue jusqu'au
      # prochain « pourquoi ça met 1 minute à démarrer ».
      - name: Assets pré-compressables au build (Phase 5)
        # Les .gz/.br sont gitignorés (artefacts) : sur un checkout neuf ils
        # n'existent pas, donc `--check` signalerait « périmé » à tort. Le CI
        # vérifie donc que le script TOURNE et produit bien des variantes
        # compressées pour chaque asset servi.
        # Récursif depuis la découpe Vite (bundles dans static/dist/assets/) et
        # aligné sur le contrat de scripts/precompress.py : seuls les .js/.css
        # de ≥ 500 o sont compressés (MIN_SIZE), les plus petits sont ignorés
        # volontairement.
        run: |
          python scripts/precompress.py -q
          python - <<'PY'
          import os
          missing = []
          for root, _dirs, files in os.walk("static"):
              for n in sorted(files):
                  if not n.endswith((".js", ".css")):
                      continue
                  src = os.path.join(root, n)
                  if os.path.getsize(src) < 500:
                      continue
                  gz = src + ".gz"
                  if not os.path.exists(gz):
                      missing.append(os.path.relpath(gz, "static"))
          print("manquants:", missing or "aucun")
          assert not missing, f"pré-compression incomplète: {missing}"
          PY
      - name: Budget d'import du boot (Phase 3/9)
        # Cible du plan : « objectif imports <800 ms ». Marge volontaire sur un
        # runner CI partagé (plus lent qu'un poste) : on échoue au-delà de
        # 1200 ms, ce qui laisse passer la variance machine tout en attrapant
        # le retour d'un import lourd (tiktoken/rich/httpx au boot).
        run: |
          python - <<'PY'
          import subprocess, sys, time
          runs = []
          for _ in range(3):
              t = time.perf_counter()
              subprocess.run([sys.executable, "-c", "import opencode"], check=True)
              runs.append((time.perf_counter() - t) * 1000)
          best = min(runs)
          print(f"import opencode: best={best:.0f} ms  runs={[round(r) for r in runs]}")
          assert best < 1200, f"import opencode trop lent: {best:.0f} ms (budget 1200 ms)"
          PY
      - name: httpx différé hors du boot (Phase 3b-1)
        # Contrat : httpx (et donc rich/click via httpx._main) ne doit PAS être
        # chargé par un `import opencode` — c'était 63 ms du chemin import → listen.
        run: |
          python -c "import sys, opencode; \
          bad=[m for m in ('httpx','rich','click','pygments','tiktoken') if m in sys.modules]; \
          print('modules charges au boot:', bad or 'aucun'); \
          assert not bad, f'imports lourds charges au boot: {bad}'"
      - name: pip-audit
        run: pip-audit --desc --local
      # [SEC-1 résolu 26/08] historique purgé (filter-repo + rotation) :
      # gitleaks passe BLOQUANT. Allowlist ciblée dans .gitleaks.toml
      # (clé locale by-design de config.yaml uniquement).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: docker compose config
        run: docker compose config > /dev/null || echo "docker compose config skipped (no docker)"
      - name: gunicorn check
        run: gunicorn -c gunicorn.conf.py opencode:app --check-config || echo "gunicorn check skipped"
