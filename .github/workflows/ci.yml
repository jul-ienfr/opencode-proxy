name: CI

on:
  push:
    branches: [main, one, one-nvpn-align]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx mypy pip-audit
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy (progressive)
        run: mypy . --ignore-missing-imports || true
        continue-on-error: false
      - name: Tests with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=35
        # Phase1 gate 35% (current 39%), Phase2 → 60, Phase3 → 75
      - name: pip-audit
        run: pip-audit --desc --local || true
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - name: docker compose config
        run: docker compose config > /dev/null || echo "docker compose config skipped (no docker)"
      - name: gunicorn check
        run: gunicorn -c gunicorn.conf.py opencode:app --check-config || echo "gunicorn check skipped"
