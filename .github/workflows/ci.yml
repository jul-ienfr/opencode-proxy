name: CI

on:
  push:
    branches: [main, one, one-nvpn-align]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio pytest-cov httpx mypy pip-audit
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: Ruff format
        run: ruff format --check .
      # [P6] mypy bloquant sur les modules SAINS (0 erreur vérifiée) ;
      # le reste tourne en progressif VISIBLE (continue-on-error) — plus de
      # `|| true` qui avalait les erreurs.
      # [26/08] rachat terminé pour tout le cœur : 11 modules gated
      # (reste progressif : gui/, scripts/, tests).
      - name: Mypy (gate modules sains)
        run: >-
          mypy traffic_capture.py docker_events.py trust.py shared_rotation.py
          shared_state.py config/__init__.py config/settings.py dashboard/api.py
          protocol_mapping.py opencode.py vpn_manager.py --ignore-missing-imports
          --follow-imports=silent
      - name: Mypy (progressif, non bloquant)
        run: mypy . --ignore-missing-imports
        continue-on-error: true
      - name: Tests with coverage
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=35
        # Phase1 gate 35% (current 39%), Phase2 → 60, Phase3 → 75
      - name: pip-audit
        run: pip-audit --desc --local
      # [SEC-1 résolu 26/08] historique purgé (filter-repo + rotation) :
      # gitleaks passe BLOQUANT. Allowlist ciblée dans .gitleaks.toml
      # (clé locale by-design de config.yaml uniquement).
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: docker compose config
        run: docker compose config > /dev/null || echo "docker compose config skipped (no docker)"
      - name: gunicorn check
        run: gunicorn -c gunicorn.conf.py opencode:app --check-config || echo "gunicorn check skipped"
