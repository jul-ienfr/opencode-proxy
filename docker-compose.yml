services:
  opencode-proxy:
    build: .
    container_name: opencode-proxy
    ports:
      - "4000:4000"
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config.yaml:/app/config.yaml:ro
      - ./api_keys.json:/app/api_keys.json:ro
    restart: unless-stopped
    depends_on:
      vpn-gluetun:
        condition: service_healthy

  vpn-gluetun:
    image: qmcgaw/gluetun
    container_name: opencode-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:8888:8888"    # HTTP proxy (loopback only)
      - "127.0.0.1:1080:1080"    # SOCKS5 proxy (loopback only)
    env_file:
      - credentials.env
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - SERVER_COUNTRIES=Germany
      - HTTP_PROXY=on
      - HTTP_PROXY_PORT=8888
      - SOCKS5_PROXY=on
      - SOCKS5_PROXY_PORT=1080
      - DNS_OVER_TLS=on
      - FIREWALL=on
      - PUID=1000
      - PGID=1000
    volumes:
      - gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "https://api.ipify.org"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  gluetun:
